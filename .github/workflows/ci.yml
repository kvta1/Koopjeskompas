# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  checks:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
 
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
 
      - name: Set up Python
        run: uv python install   # uses the version pinned in .python-version / pyproject.toml
 
      - name: Install dependencies
        run: uv sync   # the default groups: dev tools and the CDK library (for infra/ tests)
 
      - name: Lint (ruff)
        run: uv run ruff check .
 
      - name: Format check (ruff)
        run: uv run ruff format --check .
 
      - name: Type check (mypy)
        run: uv run mypy .

      - name: Tests (pytest)
        run: uv run pytest

      # Catches a dependency without a Linux arm64 wheel before it breaks a deploy.
      - name: Lambda zip builds
        run: scripts/build-lambda.sh
 


  # The image Azure Container Apps runs: it builds, starts and answers.
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Image builds
        run: docker build --tag koopjeskompas-api .

      # Without deals: health doesn't need them (ranking answers 503 until it has some).
      - name: Container starts and answers /api/health
        run: |
          docker run --detach --name api --publish 8000:8000 koopjeskompas-api
          for attempt in $(seq 1 30); do
            curl --silent --fail http://localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  # The Azure infrastructure (infra-azure/): formatted, valid, and its tests pass.
  # No Azure login: -backend=false skips the remote state, and the tests mock Azure.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-azure

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (providers from .terraform.lock.hcl, no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Tests (mocked provider)
        run: terraform test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci   # exactly what package-lock.json says

      # The backend job checks that openapi.json matches the API; this checks that
      # the TypeScript types match openapi.json.
      - name: Generated API types are current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is out of date: run 'npm run gen:api' in frontend/ and commit it"
            exit 1
          }

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build
