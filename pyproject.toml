[project]
name = "koopjeskompas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pre-commit>=4.6.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
# Skip these plugins if a ROS 2 install on PYTHONPATH registers them; harmless
# no-op on machines without ROS (e.g. CI). See CLAUDE.md for details.
addopts = "-p no:launch_testing -p no:launch_ros"
pythonpath = ["."]
