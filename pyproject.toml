[project]
name = "koopjeskompas"
version = "0.1.0"
description = "Ranks nearby Dutch supermarkets by how well their current deals fit your food preferences."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.125",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
koopjeskompas = "koopjeskompas.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
# `uv sync` installs the infrastructure tools too; the Lambda zip gets none of the groups.
default-groups = ["dev", "infra"]

[tool.uv.build-backend]
# The package lives at the repo root rather than under src/.
module-root = ""

[dependency-groups]
dev = [
    "boto3-stubs[cloudformation,s3]>=1.43.125",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.1",
    "mypy>=2.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.15.22",
]
infra = [
    "aws-cdk-lib>=2.275.0",
    "botocore[crt]>=1.43.125",
    "constructs>=10.8.1",
]

[tool.pytest.ini_options]
# Skip these plugins if a ROS 2 install on PYTHONPATH registers them; harmless
# no-op on machines without ROS (e.g. CI). See CLAUDE.md for details.
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^build/", "^dist/", "^frontend/", "^infra/cdk\\.out/", "^infra/node_modules/"]
